<!DOCTYPE html>
<html>

<head>

    <title>KrishiMitra</title>

    <style>

        body{
            margin:0;
            font-family:Arial;
            background:#f4f4f4;
        }

        /* WELCOME SCREEN */

        #welcomePage{
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background:linear-gradient(to right,#1d976c,#93f9b9);
        }

        .welcomeBox{
            background:white;
            padding:50px;
            width:60%;
            border-radius:20px;
            text-align:center;
            box-shadow:0px 0px 20px rgba(0,0,0,0.2);
        }

        .welcomeBox h1{
            font-size:50px;
            color:#1d976c;
        }

        .welcomeBox p{
            font-size:24px;
            margin-top:20px;
            color:#444;
        }

        .welcomeBox button{
            margin-top:30px;
            padding:15px 40px;
            font-size:20px;
            border:none;
            background:#1d976c;
            color:white;
            border-radius:10px;
            cursor:pointer;
        }

        /* MAIN PAGE */

        #mainPage{
            display:none;
            padding:40px;
        }

        .container{
            background:white;
            padding:30px;
            width:400px;
            margin:auto;
            border-radius:20px;
            box-shadow:0px 0px 15px rgba(0,0,0,0.1);
        }

        .container h1{
            text-align:center;
            color:#1d976c;
        }

        input{
            width:100%;
            padding:12px;
            margin-top:15px;
            border-radius:8px;
            border:1px solid #ccc;
        }

        button.predictBtn{
            width:100%;
            padding:12px;
            margin-top:20px;
            border:none;
            background:#1d976c;
            color:white;
            border-radius:10px;
            font-size:18px;
            cursor:pointer;
        }

        #result{
            margin-top:25px;
            text-align:center;
            font-size:22px;
            color:#333;
        }

    </style>

</head>

<body>

<!-- WELCOME PAGE -->

<div id="welcomePage">

    <div class="welcomeBox">

        <h1>KrishiMitra</h1>

        <p>
            Welcome to KrishiMitra,
            where you can take guidance
            on which crop to grow.
        </p>

        <button onclick="openMainPage()">
            Next
        </button>

    </div>

</div>

<!-- MAIN PAGE -->

<div id="mainPage">

    <div class="container">

        <h1>Crop Recommendation</h1>

        <input type="number"
               id="nitrogen"
               placeholder="Nitrogen">

        <input type="number"
               id="phosphorus"
               placeholder="Phosphorus">

        <input type="number"
               id="potassium"
               placeholder="Potassium">

        <button class="predictBtn"
                onclick="predictCrop()">

            Predict Crop

        </button>

        <div id="result"></div>

    </div>

</div>

<script>

function openMainPage(){

    document.getElementById("welcomePage").style.display = "none";

    document.getElementById("mainPage").style.display = "block";
}

function predictCrop(){

    let nitrogen =
        document.getElementById("nitrogen").value;

    let crop;

    if(nitrogen > 80){
        crop = "Rice";
    }
    else{
        crop = "Chickpea";
    }

    document.getElementById("result").innerHTML =
        "Recommended Crop: " + crop;
}

</script>

</body>
</html>
